<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>專科護理師學習平台 · NP Exam Prep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
/* ===== Dark Tech Theme ===== */
:root {
  --bg: #07090d;
  --bg-2: #0b0f15;
  --surface: #0f141c;
  --surface-2: #131923;
  --surface-alt: #1a212e;
  --border: #1f2733;
  --border-strong: #2c3543;
  --ink: #e7ecf3;
  --ink-2: #a8b3c4;
  --ink-3: #6c7787;
  --accent: oklch(0.78 0.16 195);
  --accent-soft: oklch(0.28 0.08 195);
  --accent-deep: oklch(0.85 0.18 195);
  --accent-glow: oklch(0.78 0.18 195 / 0.35);
  --warm: oklch(0.78 0.15 75);
  --warm-soft: oklch(0.28 0.07 75);
  --rose: oklch(0.72 0.18 15);
  --rose-soft: oklch(0.28 0.10 15);
  --violet: oklch(0.72 0.16 290);
  --violet-soft: oklch(0.28 0.10 290);
  --blue: oklch(0.74 0.15 240);
  --blue-soft: oklch(0.28 0.10 240);
  --green: oklch(0.78 0.16 145);
  --green-soft: oklch(0.28 0.08 145);
  --pink: oklch(0.74 0.18 340);
  --pink-soft: oklch(0.28 0.10 340);
  --radius: 10px;
  --radius-lg: 16px;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.5), 0 1px 3px rgba(0,0,0,0.4);
  --shadow-md: 0 2px 6px rgba(0,0,0,0.5), 0 8px 24px rgba(0,0,0,0.4);
  --shadow-lg: 0 6px 18px rgba(0,0,0,0.6), 0 24px 60px rgba(0,0,0,0.5);
  --glow: 0 0 0 1px color-mix(in oklch, var(--accent) 30%, transparent), 0 0 24px var(--accent-glow);
  --font-sans: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --font-mono: "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--ink);
  font-size: 16.5px;
  line-height: 1.65;
  -webkit-font-smoothing: antialiased;
  letter-spacing: 0.005em;
  background-image:
    radial-gradient(ellipse 80% 50% at 50% -20%, oklch(0.32 0.10 195 / 0.18), transparent),
    radial-gradient(ellipse 60% 50% at 100% 100%, oklch(0.32 0.10 290 / 0.10), transparent);
  background-attachment: fixed;
}
body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background-image:
    linear-gradient(rgba(60, 90, 110, 0.04) 1px, transparent 1px),
    linear-gradient(90deg, rgba(60, 90, 110, 0.04) 1px, transparent 1px);
  background-size: 32px 32px;
  z-index: 0;
}
#root { position: relative; z-index: 1; }

/* Layout */
.app {
  min-height: 100vh;
  display: grid;
  grid-template-columns: 280px 1fr;
  grid-template-rows: 64px 1fr;
}
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  padding: 28px 20px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  grid-row: 1 / span 2;
}
.topbar {
  grid-column: 2;
  grid-row: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px 0 48px;
  background: color-mix(in srgb, var(--surface) 70%, transparent);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 10;
  backdrop-filter: blur(14px);
}
.topbar-left { display: flex; align-items: center; gap: 14px; color: var(--ink-2); font-size: 14px; }
.topbar-right { display: flex; align-items: center; gap: 14px; }
.topbar-author {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 6px 14px 6px 8px;
  border-radius: 99px;
  background: linear-gradient(135deg, oklch(0.22 0.06 195) 0%, oklch(0.20 0.05 240) 100%);
  border: 1px solid color-mix(in oklch, var(--accent) 30%, transparent);
  box-shadow: 0 0 16px oklch(0.78 0.16 195 / 0.15), inset 0 1px 0 rgba(255,255,255,0.04);
}
.topbar-author-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--bg-2); color: var(--accent);
  display: grid; place-items: center;
  border: 1px solid color-mix(in oklch, var(--accent) 40%, transparent);
  flex-shrink: 0;
  box-shadow: 0 0 12px var(--accent-glow);
}
.topbar-author-text { line-height: 1.25; }
.topbar-author-label { font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: 0.16em; text-transform: uppercase; font-family: var(--font-mono); }
.topbar-author-name { font-size: 14px; font-weight: 700; color: var(--ink); letter-spacing: -0.005em; }
.topbar-author-name .sep-dot { display: inline-block; width: 3px; height: 3px; border-radius: 99px; background: var(--ink-3); margin: 0 6px 2px; vertical-align: middle; }
.topbar-author-affil { color: var(--ink-2); font-weight: 500; font-size: 13px; }
.topbar-author-contact { display: flex; gap: 6px; margin-top: 4px; }
.contact-chip {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--font-mono); font-size: 11px; color: var(--accent); text-decoration: none;
  padding: 2px 8px; background: oklch(0.18 0.04 195 / 0.6);
  border: 1px solid color-mix(in oklch, var(--accent) 25%, transparent);
  border-radius: 99px; letter-spacing: 0.02em; transition: all 0.15s;
}
.contact-chip:hover { background: oklch(0.22 0.06 195 / 0.8); border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
.topbar-time {
  font-size: 13px; color: var(--ink-3); font-variant-numeric: tabular-nums;
  display: flex; align-items: center; gap: 6px;
  padding-right: 14px; border-right: 1px solid var(--border); font-family: var(--font-mono);
}
.main { grid-column: 2; grid-row: 2; padding: 36px 48px 80px; max-width: 1280px; width: 100%; }

/* Brand */
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 32px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.brand-mark {
  width: 40px; height: 40px; border-radius: 10px;
  background: linear-gradient(135deg, oklch(0.45 0.15 195) 0%, oklch(0.35 0.18 220) 100%);
  display: grid; place-items: center; color: var(--accent-deep);
  position: relative;
  box-shadow: 0 0 24px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.08);
}
.brand-mark::after { content: ""; position: absolute; inset: 0; border-radius: 10px; border: 1px solid color-mix(in oklch, var(--accent) 40%, transparent); }
.brand-name { font-weight: 700; font-size: 16px; line-height: 1.25; }
.brand-tag { font-size: 11px; color: var(--accent); margin-top: 3px; letter-spacing: 0.16em; font-family: var(--font-mono); }

/* Nav */
.nav-group { margin-bottom: 22px; }
.nav-label { font-size: 11px; font-weight: 700; color: var(--ink-3); text-transform: uppercase; letter-spacing: 0.14em; padding: 0 10px 8px; font-family: var(--font-mono); }
.nav-item {
  display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 8px;
  cursor: pointer; font-size: 15px; color: var(--ink-2); transition: all 0.15s; user-select: none;
}
.nav-item:hover { background: var(--surface-alt); color: var(--ink); }
.nav-item.active {
  background: linear-gradient(90deg, oklch(0.25 0.08 195) 0%, transparent 100%);
  color: var(--accent); font-weight: 600; position: relative;
}
.nav-item.active::before {
  content: ""; position: absolute; left: 0; top: 6px; bottom: 6px; width: 2px;
  background: var(--accent); border-radius: 99px; box-shadow: 0 0 8px var(--accent-glow);
}
.nav-icon { width: 18px; height: 18px; display: grid; place-items: center; flex-shrink: 0; }
.nav-badge {
  margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--ink-3);
  background: var(--surface-alt); padding: 2px 9px; border-radius: 99px; font-family: var(--font-mono);
}
.nav-item.active .nav-badge { background: var(--bg-2); color: var(--accent); border: 1px solid color-mix(in oklch, var(--accent) 30%, transparent); }

/* Page Header */
.page-head { margin-bottom: 28px; display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; flex-wrap: wrap; }
.page-title {
  font-size: 32px; font-weight: 700; letter-spacing: -0.015em; margin: 0 0 8px;
  background: linear-gradient(135deg, var(--ink) 0%, var(--accent) 100%);
  -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
}
.page-sub { color: var(--ink-3); font-size: 14px; font-family: var(--font-mono); letter-spacing: 0.02em; }

/* Filters */
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
.filter-group { display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 4px 4px 4px 14px; }
.filter-label { font-size: 12px; color: var(--ink-3); font-weight: 500; letter-spacing: 0.02em; }
.filter-chips { display: flex; gap: 2px; }
.chip {
  font-size: 13.5px; padding: 6px 13px; border-radius: 99px; cursor: pointer;
  color: var(--ink-2); font-weight: 500; border: none; background: transparent; font-family: inherit; transition: all 0.15s;
}
.chip:hover { background: var(--surface-alt); color: var(--ink); }
.chip.active { background: var(--accent); color: var(--bg); box-shadow: 0 0 12px var(--accent-glow); }

/* Specialty colors */
.spec-internal { --spec: var(--blue); --spec-soft: var(--blue-soft); }
.spec-psych { --spec: var(--violet); --spec-soft: var(--violet-soft); }
.spec-pediatric { --spec: var(--warm); --spec-soft: var(--warm-soft); }
.spec-surgery { --spec: var(--rose); --spec-soft: var(--rose-soft); }
.spec-obgyn { --spec: var(--pink); --spec-soft: var(--pink-soft); }
.spec-anesth { --spec: var(--green); --spec-soft: var(--green-soft); }

/* Cards */
.card {
  background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 22px;
  position: relative; overflow: hidden;
}
.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }

/* Deck cards */
.deck-card {
  background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px;
  cursor: pointer; transition: all 0.2s; position: relative; overflow: hidden;
}
.deck-card:hover {
  border-color: var(--spec, var(--accent));
  box-shadow: 0 0 0 1px var(--spec, var(--accent)), 0 0 32px color-mix(in oklch, var(--spec, var(--accent)) 25%, transparent);
  transform: translateY(-2px);
}
.deck-card::before {
  content: ""; position: absolute; inset: 0 auto 0 0; width: 3px;
  background: var(--spec, var(--accent));
  box-shadow: 0 0 12px color-mix(in oklch, var(--spec, var(--accent)) 50%, transparent);
}
.deck-spec-tag {
  display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 700;
  color: var(--spec, var(--accent)); background: var(--spec-soft, var(--accent-soft));
  padding: 3px 10px; border-radius: 99px; letter-spacing: 0.05em;
  border: 1px solid color-mix(in oklch, var(--spec, var(--accent)) 30%, transparent);
  text-transform: uppercase; font-family: var(--font-mono);
}
.deck-year { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; font-family: var(--font-mono); letter-spacing: 0.08em; }
.deck-title { font-size: 17px; font-weight: 700; margin: 14px 0 4px; letter-spacing: -0.01em; }
.deck-meta { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.deck-count { font-size: 14px; color: var(--ink-2); }
.deck-count strong { font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }
.deck-progress { height: 4px; background: var(--surface-alt); border-radius: 99px; overflow: hidden; margin-top: 10px; }
.deck-progress-fill {
  height: 100%; background: var(--spec, var(--accent)); border-radius: 99px; transition: width 0.4s ease;
  box-shadow: 0 0 8px color-mix(in oklch, var(--spec, var(--accent)) 50%, transparent);
}

/* Flashcard */
.flash-stage { display: grid; grid-template-columns: 1fr; gap: 18px; }
.flash-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
.flash-back { display: inline-flex; align-items: center; gap: 6px; border: none; background: none; color: var(--ink-2); font-family: inherit; font-size: 14px; cursor: pointer; padding: 6px 0; }
.flash-back:hover { color: var(--ink); }
.flash-progress { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--ink-3); font-weight: 500; }
.flash-progress strong { color: var(--ink); font-size: 15px; font-weight: 700; }
.flash-bar { height: 6px; background: var(--surface-alt); border-radius: 99px; overflow: hidden; }
.flash-bar-fill {
  height: 100%; background: linear-gradient(90deg, var(--accent), oklch(0.65 0.18 220));
  border-radius: 99px; transition: width 0.4s cubic-bezier(.22,.61,.36,1); box-shadow: 0 0 12px var(--accent-glow);
}
.flash-card { perspective: 1200px; }
.flash-card-inner { position: relative; width: 100%; }
/* 只顯示當前一面（由 JSX 的 display 切換），翻面用「僅正面朝向」的翻入動畫，
   永遠不會出現朝背的鏡像內容 —— 修正 iOS Safari backface-visibility 失效導致的
   鏡像文字與幽靈按鈕（手機無法點選）問題。 */
/* 純淡入（不用 3D transform），避免動畫期間 transform 造成觸控命中偏移 */
@keyframes flashFlipIn { from { opacity: 0; } to { opacity: 1; } }
.flash-face {
  min-height: 520px;
  background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 36px 40px;
  display: flex; flex-direction: column; box-shadow: var(--shadow-md); overflow: hidden;
  animation: flashFlipIn 0.42s cubic-bezier(.22,.61,.36,1);
}
.flash-face::before {
  content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, color-mix(in oklch, var(--spec, var(--accent)) 50%, transparent), transparent);
}
.flash-face.back { background: linear-gradient(180deg, var(--surface) 0%, oklch(0.18 0.04 195 / 0.3) 100%); }
.flash-meta { display: flex; gap: 8px; align-items: center; margin-bottom: 18px; flex-wrap: wrap; }
.flash-tag {
  font-size: 10px; font-weight: 700; padding: 3px 10px; border-radius: 99px; letter-spacing: 0.08em;
  background: var(--surface-alt); color: var(--ink-2); text-transform: uppercase; font-family: var(--font-mono); border: 1px solid var(--border);
}
.flash-tag.spec { background: var(--spec-soft, var(--accent-soft)); color: var(--spec, var(--accent)); border-color: color-mix(in oklch, var(--spec, var(--accent)) 30%, transparent); }
.flash-tag.year { font-variant-numeric: tabular-nums; }
.flash-stem { font-size: 20px; line-height: 1.75; color: var(--ink); letter-spacing: 0.005em; }
.flash-stem .stem-label { display: inline-block; font-size: 12px; font-weight: 700; color: var(--ink-3); letter-spacing: 0.12em; margin-bottom: 10px; font-family: var(--font-mono); }
.flash-options { list-style: none; padding: 0; margin: 22px 0 0; display: grid; gap: 10px; }
.flash-option { display: flex; gap: 14px; padding: 14px 16px; background: var(--surface-alt); border-radius: 10px; font-size: 16.5px; line-height: 1.55; align-items: flex-start; }
.flash-option-key { font-weight: 700; color: var(--ink-3); width: 22px; flex-shrink: 0; font-variant-numeric: tabular-nums; font-family: var(--font-mono); }
.flash-hint { margin-top: auto; padding-top: 18px; font-size: 12px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; letter-spacing: 0.02em; }
.kbd { font-family: var(--font-mono); font-size: 11px; background: var(--surface-alt); border: 1px solid var(--border); border-bottom-width: 2px; padding: 1px 6px; border-radius: 4px; color: var(--accent); }
.flash-answer-row { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
.flash-answer-key {
  font-size: 32px; font-weight: 800; color: var(--accent);
  background: linear-gradient(135deg, oklch(0.32 0.10 195) 0%, oklch(0.28 0.10 220) 100%);
  width: 60px; height: 60px; border-radius: 12px; display: grid; place-items: center;
  letter-spacing: -0.02em; border: 1px solid color-mix(in oklch, var(--accent) 40%, transparent);
  box-shadow: 0 0 20px var(--accent-glow), inset 0 1px 0 rgba(255,255,255,0.05); font-family: var(--font-mono);
}
.flash-answer-text { font-size: 17px; color: var(--ink); font-weight: 500; }
.flash-answer-label { font-size: 12px; color: var(--ink-3); letter-spacing: 0.12em; font-weight: 700; font-family: var(--font-mono); }
.flash-explain { font-size: 15.5px; line-height: 1.8; color: var(--ink-2); overflow-y: auto; flex: 1; padding-right: 8px; }
.flash-explain h4 { font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: 0.14em; text-transform: uppercase; margin: 18px 0 8px; display: flex; align-items: center; gap: 6px; font-family: var(--font-mono); }
.flash-explain h4:first-child { margin-top: 0; }
.flash-explain p { margin: 0 0 8px; }
.flash-explain ul { padding-left: 18px; margin: 4px 0 8px; }
.flash-explain li { margin: 2px 0; }
.flash-source { margin-top: 16px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 13px; color: var(--ink-3); }
.flash-source-label { font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; font-size: 11px; display: flex; align-items: center; gap: 5px; margin-bottom: 6px; color: var(--accent); font-family: var(--font-mono); }

/* Flash actions */
.flash-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-top: 4px; }
.flash-btn {
  border: 1px solid var(--border); background: var(--surface); padding: 14px; border-radius: 10px;
  font-family: inherit; font-size: 14px; cursor: pointer; display: flex; flex-direction: column;
  align-items: center; gap: 4px; transition: all 0.15s; color: var(--ink-2);
}
.flash-btn:hover { transform: translateY(-1px); box-shadow: var(--shadow-sm); background: var(--surface-alt); }
.flash-btn .lab { font-weight: 700; color: var(--ink); font-size: 15px; }
.flash-btn .sub { font-size: 12px; color: var(--ink-3); letter-spacing: 0.02em; }
.flash-btn.again:hover { border-color: var(--rose); box-shadow: 0 0 16px color-mix(in oklch, var(--rose) 25%, transparent); }
.flash-btn.again:hover .lab { color: var(--rose); }
.flash-btn.hard:hover { border-color: var(--warm); box-shadow: 0 0 16px color-mix(in oklch, var(--warm) 25%, transparent); }
.flash-btn.hard:hover .lab { color: var(--warm); }
.flash-btn.good:hover { border-color: var(--accent); box-shadow: 0 0 16px var(--accent-glow); }
.flash-btn.good:hover .lab { color: var(--accent); }
.flash-nav { display: flex; gap: 10px; justify-content: space-between; align-items: center; }
.icon-btn { width: 44px; height: 44px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink-2); }
.icon-btn:hover { background: var(--surface-alt); color: var(--accent); border-color: var(--accent); }
.icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
.flip-btn {
  flex: 1; height: 44px; border-radius: 10px;
  border: 1px solid color-mix(in oklch, var(--accent) 50%, transparent);
  background: linear-gradient(135deg, var(--accent) 0%, oklch(0.65 0.18 220) 100%);
  color: var(--bg); font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer;
  letter-spacing: 0.04em; box-shadow: 0 0 24px var(--accent-glow);
}
.flip-btn:hover { filter: brightness(1.1); box-shadow: 0 0 32px var(--accent-glow); }

/* Dashboard */
.kpi-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 18px; }
.kpi {
  background: linear-gradient(180deg, var(--surface) 0%, var(--surface-2) 100%);
  border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 20px 22px;
  position: relative; overflow: hidden;
}
.kpi::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent, color-mix(in oklch, var(--accent) 40%, transparent), transparent); }
.kpi-icon {
  position: absolute; top: 18px; right: 18px; width: 32px; height: 32px; border-radius: 8px;
  display: grid; place-items: center; background: var(--accent-soft); color: var(--accent);
  border: 1px solid color-mix(in oklch, var(--accent) 30%, transparent);
}
.kpi-icon.warm { background: var(--warm-soft); color: var(--warm); border-color: color-mix(in oklch, var(--warm) 30%, transparent); }
.kpi-icon.blue { background: var(--blue-soft); color: var(--blue); border-color: color-mix(in oklch, var(--blue) 30%, transparent); }
.kpi-icon.rose { background: var(--rose-soft); color: var(--rose); border-color: color-mix(in oklch, var(--rose) 30%, transparent); }

  <script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import { getFirestore, doc, setDoc, getDoc, updateDoc, deleteDoc, collection, onSnapshot, serverTimestamp, query, orderBy, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBrs80vpFVe-iEh5ctzRWfYHUBb3KGvILo",
  authDomain: "speech-to-text-2f776.firebaseapp.com",
  projectId: "speech-to-text-2f776",
  storageBucket: "speech-to-text-2f776.firebasestorage.app",
  messagingSenderId: "283739023798",
  appId: "1:283739023798:web:3091ec2bcf6262b5ecb917"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const USERS_COL = "np_learning_users";   // 與 np-anesthesia 分開，避免混用
window.ADMIN_EMAIL = "jiahowchang@gmail.com";
const googleProvider = new GoogleAuthProvider();
googleProvider.setCustomParameters({ prompt: "select_account" });

let cachedProfile = null;   // Firebase 使用者的 profile
let guestProfile = null;    // 訪客（本機，不寫入雲端）
const authListeners = new Set();
let authResolved = false;   // Firebase 是否已回報過一次登入狀態
const notify = () => { authResolved = true; authListeners.forEach(fn => fn(guestProfile || cachedProfile)); };

getRedirectResult(auth).catch(e => console.warn("Redirect result error", e));

onAuthStateChanged(auth, async (user) => {
  if (!user) { cachedProfile = null; notify(); return; }
  guestProfile = null; // 真正登入後即取消訪客身分
  try {
    const snap = await getDoc(doc(db, USERS_COL, user.uid));
    if (snap.exists()) {
      const data = snap.data();
      if (data.status === "disabled") {
        await signOut(auth); cachedProfile = null;
        alert("您的帳號已被管理員停用。如有疑問請聯絡 " + window.ADMIN_EMAIL);
        notify(); return;
      }
      try { updateDoc(doc(db, USERS_COL, user.uid), { lastLoginAt: serverTimestamp() }); } catch(e) {}
      cachedProfile = { uid: user.uid, ...data, isAdmin: user.email === window.ADMIN_EMAIL, needsProfile: false };
    } else {
      cachedProfile = { uid: user.uid, email: user.email, name: user.displayName || (user.email || "").split("@")[0], photoURL: user.photoURL || null, isAdmin: user.email === window.ADMIN_EMAIL, needsProfile: true };
    }
    notify();
  } catch (e) { console.error("Profile load failed", e); cachedProfile = null; notify(); }
});

window.AuthAPI = {
  current: () => guestProfile || cachedProfile,
  subscribe: (fn) => { authListeners.add(fn); if (authResolved) { try { fn(guestProfile || cachedProfile); } catch(e){} } return () => authListeners.delete(fn); },
  signInWithGoogle: async () => {
    // 只用 popup。signInWithRedirect 在 iOS/iPad 與 GitHub Pages（跨網域 firebaseapp.com）
    // 會因儲存分區出現「missing initial state」錯誤，故不再 fallback 到 redirect；
    // popup 失敗時由 UI 導向 Email 登入。
    await signInWithPopup(auth, googleProvider);
  },
  registerWithEmail: async (email, password) => { await createUserWithEmailAndPassword(auth, email.trim(), password); },
  signInWithEmail: async (email, password) => { await signInWithEmailAndPassword(auth, email.trim(), password); },
  resetPassword: async (email) => { await sendPasswordResetEmail(auth, email.trim()); },
  guestLogin: () => { guestProfile = { uid: "guest", email: "guest@local", name: "訪客", role: "other", isGuest: true, isAdmin: false, needsProfile: false }; notify(); },
  completeProfile: async ({ name, role, experience, hospital, examGroup }) => {
    const user = auth.currentUser;
    if (!user) throw new Error("尚未登入");
    const profileToSave = { uid: user.uid, email: user.email, name: name || user.displayName || "", role: role || "trainee", experience: experience || "", hospital: hospital || "", examGroup: examGroup || "", photoURL: user.photoURL || null, status: "active", createdAt: serverTimestamp(), lastLoginAt: serverTimestamp() };
    try { await setDoc(doc(db, USERS_COL, user.uid), profileToSave); }
    catch (e) { console.error("completeProfile setDoc failed:", e); throw new Error("儲存失敗：" + (e.code || e.message || "未知錯誤")); }
    try { const snap = await getDoc(doc(db, USERS_COL, user.uid)); const data = snap.exists() ? snap.data() : profileToSave; cachedProfile = { uid: user.uid, ...data, isAdmin: user.email === window.ADMIN_EMAIL, needsProfile: false }; }
    catch (e) { cachedProfile = { uid: user.uid, ...profileToSave, createdAt: null, lastLoginAt: null, isAdmin: user.email === window.ADMIN_EMAIL, needsProfile: false }; }
    notify(); return cachedProfile;
  },
  logout: async () => { guestProfile = null; notify(); try { await signOut(auth); } catch(e) {} },
};

window.AdminAPI = {
  subscribeUsers: (callback) => {
    const q = query(collection(db, USERS_COL), orderBy("createdAt", "desc"));
    return onSnapshot(q, (snap) => { const users = []; snap.forEach(d => users.push({ uid: d.id, ...d.data() })); callback(users); }, (err) => { console.error("subscribeUsers error", err); callback([]); });
  },
  setStatus: async (uid, status) => { await updateDoc(doc(db, USERS_COL, uid), { status, statusUpdatedAt: serverTimestamp() }); },
  deleteProfile: async (uid) => { await deleteDoc(doc(db, USERS_COL, uid)); },
};

// Stats API — 每題作答統計（登入→Firestore 跨裝置；訪客→localStorage）
// attempts: { [qid]: { n: 作答次數, w: 答錯次數, last: 上次對錯(1/0), at } }
const STATS_COL = "np_learning_stats";
const GUEST_STATS_KEY = "np_learn_stats_guest";
window.StatsAPI = {
  load: async () => {
    const user = auth.currentUser;
    if (!user) { try { return JSON.parse(localStorage.getItem(GUEST_STATS_KEY) || "{}"); } catch(e) { return {}; } }
    try { const snap = await getDoc(doc(db, STATS_COL, user.uid)); return snap.exists() ? (snap.data().attempts || {}) : {}; }
    catch(e) { console.error("StatsAPI.load", e); return {}; }
  },
  record: async (qid, correct) => {
    const user = auth.currentUser;
    if (!user) {
      let s = {}; try { s = JSON.parse(localStorage.getItem(GUEST_STATS_KEY) || "{}"); } catch(err){}
      const ent = s[qid] || { n: 0, w: 0 }; ent.n++; if (!correct) ent.w++; ent.last = correct ? 1 : 0; ent.at = Date.now(); s[qid] = ent;
      try { localStorage.setItem(GUEST_STATS_KEY, JSON.stringify(s)); } catch(err){}
      return;
    }
    try {
      await setDoc(doc(db, STATS_COL, user.uid), { uid: user.uid, attempts: { [qid]: { n: increment(1), w: increment(correct ? 0 : 1), last: correct ? 1 : 0, at: serverTimestamp() } }, updatedAt: serverTimestamp() }, { merge: true });
    } catch(err) { console.error("StatsAPI.record", err); }
  },
  reset: async () => {
    const user = auth.currentUser;
    if (!user) { try { localStorage.removeItem(GUEST_STATS_KEY); } catch(e){} return; }
    try { await deleteDoc(doc(db, STATS_COL, user.uid)); } catch(err) { console.error("StatsAPI.reset", err); }
  },
};

function AuthScreen() {

      else if (code === "auth/popup-blocked") msg = "此裝置擋住了 Google 登入彈窗（iPad／手機常見）。請改用下方 Email 登入，或改用電腦版 Chrome。";

      else if (code === "auth/network-request-failed") msg = "網路錯誤，請檢查連線";
      else if (code === "auth/unauthorized-domain") msg = "此網域未授權使用此登入方式，請聯絡管理員 jiahowchang@gmail.com";
      else if (code === "auth/operation-not-supported-in-this-environment" || code === "auth/web-storage-unsupported") msg = "此瀏覽器不支援 Google 登入，請改用下方 Email 登入，或用 Safari／Chrome 開啟本站。";

      else await window.AuthAPI.signInWithEmail(email, pw);

      else if (c === "auth/network-request-failed") m = "網路錯誤，請檢查連線";
      else if (c === "auth/operation-not-allowed") m = "Email 登入尚未啟用，請聯絡管理員 jiahowchang@gmail.com";
      setErr(m); setLoading(false);
    }
  };
  const handleReset = async () => {

  };
  const copyUrl = async () => {
    try { await navigator.clipboard.writeText(location.href); setCopied(true); setTimeout(() => setCopied(false), 2200); }
    catch (e) { const ta = document.createElement("textarea"); ta.value = location.href; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); setCopied(true); setTimeout(() => setCopied(false), 2200); } catch(_){} document.body.removeChild(ta); }
  };
  return (

// ===== DeckList =====
function DeckList({ onPickDeck }) {
  const [yearFilter, setYearFilter] = useState("all");
  const [specFilter, setSpecFilter] = useState("all");
  const [typeFilter, setTypeFilter] = useState("all");
  const [query, setQuery] = useState("");
  const decks = useMemo(() => {
    const map = new Map();
    for (const q of window.QUESTIONS) {
      const key = q.year + "::" + q.specialty;
      if (!map.has(key)) { const spec = window.SPECIALTIES.find(s => s.id === q.specialty); map.set(key, { year: q.year, specialty: q.specialty, specName: spec.name, className: spec.className, short: spec.short, qs: [] }); }
      map.get(key).qs.push(q);
    }
    return [...map.values()].sort((a, b) => b.year - a.year || a.specialty.localeCompare(b.specialty));
  }, []);
  const filtered = decks.filter(d => {
    if (yearFilter !== "all" && d.year !== Number(yearFilter)) return false;
    if (specFilter !== "all" && d.specialty !== specFilter) return false;
    if (typeFilter !== "all" && !d.qs.some(q => q.type === typeFilter)) return false;
    if (query && !d.qs.some(q => q.stem.includes(query) || q.id.toLowerCase().includes(query.toLowerCase()))) return false;
    return true;
  });
  return (
    <div className="fade-in">
      <div className="page-head">
        <div>
          <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 4 }}>
            <div style={{ width: 36, height: 36, borderRadius: 9, background: "var(--accent-soft)", color: "var(--accent-deep)", display: "grid", placeItems: "center" }}><MedIcon name="bookmark" size={18}/></div>
            <h1 className="page-title" style={{ margin: 0 }}>考古題卡組</h1>
          </div>
          <p className="page-sub">點選任一卡組進入閃卡複習模式 · 共 {filtered.length} 組 / {filtered.reduce((a, d) => a + d.qs.length, 0)} 題</p>
        </div>
      </div>
      <input className="search-input" placeholder="搜尋題目關鍵字或題號（例：心衰、Q-INT-113-01）" value={query} onChange={e => setQuery(e.target.value)} />
      <div className="filters">
        <div className="filter-group"><span className="filter-label">年度</span><div className="filter-chips"><button className={"chip " + (yearFilter === "all" ? "active" : "")} onClick={() => setYearFilter("all")}>全部</button>{window.YEARS.map(y => <button key={y} className={"chip " + (yearFilter === String(y) ? "active" : "")} onClick={() => setYearFilter(String(y))}>{y}</button>)}</div></div>
        <div className="filter-group"><span className="filter-label">科別</span><div className="filter-chips"><button className={"chip " + (specFilter === "all" ? "active" : "")} onClick={() => setSpecFilter("all")}>全部</button>{window.SPECIALTIES.map(s => <button key={s.id} className={"chip " + (specFilter === s.id ? "active" : "")} onClick={() => setSpecFilter(s.id)}>{s.name}</button>)}</div></div>
        <div className="filter-group"><span className="filter-label">題型</span><div className="filter-chips"><button className={"chip " + (typeFilter === "all" ? "active" : "")} onClick={() => setTypeFilter("all")}>全部</button>{window.QUESTION_TYPES.map(t => <button key={t.id} className={"chip " + (typeFilter === t.id ? "active" : "")} onClick={() => setTypeFilter(t.id)}>{t.name}</button>)}</div></div>
      </div>
      <div className="card-grid">
        {filtered.map(d => <DeckCard key={d.year + d.specialty} deck={d} onPick={() => onPickDeck(d)} />)}
        {filtered.length === 0 && <div style={{ gridColumn: "1 / -1", padding: 48, textAlign: "center", color: "var(--ink-3)" }}>找不到符合條件的卡組</div>}
      </div>
    </div>
  );
}
function DeckCard({ deck, onPick }) {
  const progressKey = "progress::" + deck.year + "::" + deck.specialty;
  const progress = Number(localStorage.getItem(progressKey) || 0);
  const pct = Math.round((progress / deck.qs.length) * 100);
  const types = [...new Set(deck.qs.map(q => q.type))].map(t => window.QUESTION_TYPES.find(x => x.id === t)?.name).filter(Boolean);
  return (
    <div className={"deck-card " + deck.className} onClick={onPick}>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start" }}>
        <div className="spec-icon-tile sm" style={{ width: 32, height: 32 }}><SpecIcon id={deck.specialty} size={18} /></div>
        <span className="deck-year">{deck.year} 年</span>
      </div>
      <span className="deck-spec-tag" style={{ marginTop: 14 }}><span style={{ width: 6, height: 6, borderRadius: 99, background: "currentColor" }}></span>{deck.specName}</span>
      <div className="deck-title">{deck.year}年度 {deck.specName}考古題</div>
      <div style={{ fontSize: 12, color: "var(--ink-3)", marginTop: 2 }}>{types.join(" · ")}</div>
      <div className="deck-progress"><div className="deck-progress-fill" style={{ width: pct + "%" }}></div></div>
      <div className="deck-meta">
        <span className="deck-count"><strong>{deck.qs.length}</strong> 題 · 已複習 <strong>{progress}</strong></span>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ color: "var(--ink-3)" }}><path d="m9 18 6-6-6-6"/></svg>
      </div>
    </div>
  );
}

// ===== Flashcard =====
function Flashcard({ deck, onExit }) {
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [reviewed, setReviewed] = useState(() => new Set());
  const [selected, setSelected] = useState(null);
  const [answers, setAnswers] = useState(() => ({}));   // { qid: { picked, correct } }
  const [showResult, setShowResult] = useState(false);
  const total = deck.qs.length;
  const q = deck.qs[idx];
  const spec = window.SPECIALTIES.find(s => s.id === q.specialty);
  const type = window.QUESTION_TYPES.find(t => t.id === q.type);
  const next = useCallback(() => {
    if (idx >= total - 1) { setShowResult(true); return; }   // 最後一題後 → 顯示成績
    setFlipped(false); setSelected(null); setIdx(i => i + 1);
  }, [idx, total]);
  const prev = useCallback(() => { setFlipped(false); setSelected(null); setIdx(i => Math.max(0, i - 1)); }, []);
  const pickAnswer = (key) => {
    if (selected) return;
    setSelected(key);
    const isRight = key === q.answer;
    setAnswers(a => a[q.id] ? a : ({ ...a, [q.id]: { picked: key, correct: isRight } }));
    try { window.StatsAPI && window.StatsAPI.record(q.id, isRight); } catch(e) {}  // 累積個人化統計
    setTimeout(() => setFlipped(true), 700);
  };
  const restart = () => { setShowResult(false); setIdx(0); setSelected(null); setFlipped(false); setAnswers({}); };
  const rate = (level) => {
    const k = "progress::" + deck.year + "::" + deck.specialty;
    const newSet = new Set(reviewed); newSet.add(q.id); setReviewed(newSet);
    localStorage.setItem(k, String(newSet.size));
    setTimeout(next, 200);
  };
  useEffect(() => {
    const onKey = (e) => {
      const t = e.target;
      if (t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable)) return;
      if (e.key === " ") { e.preventDefault(); setFlipped(f => !f); }
      else if (e.key === "ArrowRight") next();
      else if (e.key === "ArrowLeft") prev();
      else if (e.key === "Escape") onExit();
      else if (!flipped && !selected && ["A","B","C","D","a","b","c","d"].includes(e.key)) pickAnswer(e.key.toUpperCase());
      else if (flipped && e.key === "1") rate("again");
      else if (flipped && e.key === "2") rate("hard");
      else if (flipped && e.key === "3") rate("good");
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [next, prev, q.id, deck, selected, flipped]);
  const pct = Math.round(((idx + 1) / total) * 100);
  if (showResult) {
    const attempted = Object.keys(answers).length;
    const correct = Object.values(answers).filter(a => a.correct).length;
    const unanswered = total - attempted;
    const scorePct = total ? Math.round((correct / total) * 100) : 0;
    const attemptRate = attempted ? Math.round((correct / attempted) * 100) : 0;
    const wrong = deck.qs.filter(qq => answers[qq.id] && !answers[qq.id].correct);
    const grade = scorePct >= 80 ? { t: "優異", c: "oklch(0.72 0.17 150)" } : scorePct >= 60 ? { t: "及格", c: "oklch(0.78 0.15 90)" } : { t: "待加強", c: "oklch(0.68 0.19 25)" };
    const statBox = (label, val, col) => (
      <div style={{ background: "var(--surface-alt)", border: "1px solid var(--border)", borderRadius: 12, padding: "14px 10px", textAlign: "center" }}>
        <div style={{ fontSize: 12, color: "var(--ink-3)", marginBottom: 4 }}>{label}</div>
        <div style={{ fontSize: 26, fontWeight: 800, color: col || "var(--ink-1)", fontVariantNumeric: "tabular-nums" }}>{val}</div>
      </div>
    );
    return (
      <div className="fade-in flash-stage">
        <div className="flash-toolbar">
          <button className="flash-back" onClick={onExit}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>返回卡組</button>
          <div className="flash-progress">本卷成績</div>
        </div>
        <div className="card" style={{ padding: 32 }}>
          <div style={{ textAlign: "center" }}>
            <div style={{ fontSize: 13, color: "var(--ink-3)", letterSpacing: "0.08em" }}>{spec.name} · {q.year} 年 · {type.name} · 本卷成績</div>
            <div style={{ fontSize: 64, fontWeight: 800, margin: "6px 0 2px", color: grade.c, fontVariantNumeric: "tabular-nums", lineHeight: 1.05 }}>{scorePct}<span style={{ fontSize: 22, color: "var(--ink-3)", fontWeight: 700 }}> 分</span></div>
            <div style={{ display: "inline-block", padding: "3px 14px", borderRadius: 20, background: "color-mix(in oklch, " + grade.c + " 16%, transparent)", color: grade.c, fontWeight: 700, fontSize: 13, marginBottom: 20 }}>{grade.t}</div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "repeat(4, 1fr)", gap: 10, marginBottom: 18 }}>
            {statBox("總題數", total)}
            {statBox("答對", correct, "oklch(0.75 0.16 150)")}
            {statBox("答錯", attempted - correct, "oklch(0.7 0.18 25)")}
            {statBox("未作答", unanswered, "var(--ink-3)")}
          </div>
          <div style={{ color: "var(--ink-2)", fontSize: 14, marginBottom: 20, textAlign: "center", lineHeight: 1.7 }}>
            作答 {attempted} 題，答對率 <b style={{ color: "var(--ink-1)" }}>{attemptRate}%</b>（僅計已作答）；<br/>總分以全卷 {total} 題計（未作答不計分）＝ <b style={{ color: grade.c }}>{scorePct} 分</b>
          </div>
          {wrong.length > 0 && (
            <div>
              <div style={{ fontSize: 13, fontWeight: 700, color: "var(--ink-2)", marginBottom: 10 }}>答錯題目（{wrong.length}）· 點擊複習</div>
              <div style={{ display: "grid", gap: 8, maxHeight: 300, overflowY: "auto" }}>
                {wrong.map(qq => (
                  <button key={qq.id} type="button" onClick={() => { setIdx(deck.qs.indexOf(qq)); setSelected(answers[qq.id].picked); setFlipped(true); setShowResult(false); }}
                    style={{ textAlign: "left", background: "var(--surface-alt)", border: "1px solid var(--border)", borderRadius: 10, padding: "10px 14px", cursor: "pointer", color: "inherit", font: "inherit", width: "100%" }}>
                    <div style={{ fontSize: 12, color: "var(--ink-3)", fontFamily: "var(--font-mono)", marginBottom: 3 }}>{qq.id} · 你選 {answers[qq.id].picked}，正確 {qq.answer}</div>
                    <div style={{ fontSize: 13.5, color: "var(--ink-1)" }}>{qq.stem.replace(/\n/g, " ").slice(0, 44)}…</div>
                  </button>
                ))}
              </div>
            </div>
          )}
          <div style={{ display: "flex", gap: 12, justifyContent: "center", marginTop: 24, flexWrap: "wrap" }}>
            <button className="btn-primary" onClick={restart}><MedIcon name="play" size={14}/><span style={{ marginLeft: 8 }}>重新作答本卷</span></button>
            <button className="btn-ghost" onClick={onExit}>返回卡組</button>
          </div>
        </div>
      </div>
    );
  }
  return (
    <div className={"fade-in flash-stage " + spec.className}>
      <div className="flash-toolbar">
        <button className="flash-back" onClick={onExit}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg>返回卡組</button>
        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
          <span className="flash-tag spec">{spec.name}</span>
          <span className="flash-tag year">{q.year} 年</span>
          <span className="flash-tag">{type.name}</span>
        </div>
        <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
          <div className="flash-progress"><strong>{idx + 1}</strong> / {total}</div>
          {Object.keys(answers).length > 0 && <button type="button" onClick={() => setShowResult(true)} style={{ background: "var(--accent-soft)", color: "var(--accent-deep)", border: "1px solid color-mix(in oklch, var(--accent) 30%, transparent)", borderRadius: 8, padding: "5px 12px", fontSize: 12.5, fontWeight: 700, cursor: "pointer", fontFamily: "inherit", whiteSpace: "nowrap" }}>交卷看成績</button>}
        </div>
      </div>
      <div className="flash-bar"><div className="flash-bar-fill" style={{ width: pct + "%" }}></div></div>
      <div className={"flash-card " + (flipped ? "flipped" : "")}>
        <div className="flash-card-inner">
          <div className="flash-face front" style={{ display: flipped ? "none" : "flex" }}>
            <div className="flash-meta">
              <div className="spec-icon-tile sm" style={{ marginRight: 4 }}><SpecIcon id={q.specialty} size={16}/></div>
              <span className="flash-tag" style={{ fontFamily: "var(--font-mono)" }}>{q.id}</span>
              <span style={{ fontSize: 11, color: "var(--ink-3)", letterSpacing: "0.06em", marginLeft: "auto" }}>
                {selected ? (selected === q.answer ? "✓ 答對了" : "✗ 答錯，正確為 (" + q.answer + ")") : "點選作答（A／B／C／D）"}
              </span>
            </div>
            <div className="flash-stem">
              <span className="stem-label">題目</span>
              <div>{q.stem}</div>
              <div className="flash-options">
                {q.options.map(o => {
                  const isCorrect = o.key === q.answer;
                  const isPicked = o.key === selected;
                  let bg = "var(--surface-alt)";
                  let border = "1px solid transparent";
                  if (selected) {
                    if (isCorrect) { bg = "color-mix(in oklch, oklch(0.65 0.18 150) 18%, var(--surface-alt))"; border = "1px solid oklch(0.65 0.18 150)"; }
                    else if (isPicked) { bg = "color-mix(in oklch, oklch(0.60 0.20 25) 18%, var(--surface-alt))"; border = "1px solid oklch(0.60 0.20 25)"; }
                  }
                  return (
                    <button type="button" key={o.key} className="flash-option" onClick={() => pickAnswer(o.key)}
                        style={{ background: bg, border, cursor: selected ? "default" : "pointer", transition: "all 0.18s", userSelect: "none",
                                 font: "inherit", color: "inherit", textAlign: "left", width: "100%", margin: 0, appearance: "none", WebkitAppearance: "none", WebkitTapHighlightColor: "transparent", touchAction: "manipulation" }}>
                      <span className="flash-option-key" style={{ color: selected && (isCorrect || isPicked) ? (isCorrect ? "oklch(0.78 0.18 150)" : "oklch(0.75 0.20 25)") : undefined }}>({o.key})</span>
                      <span style={{ flex: 1 }}>{o.text}</span>
                      {selected && isCorrect && <span style={{ color: "oklch(0.78 0.18 150)", fontWeight: 700, marginLeft: 8 }}>✓</span>}
                      {selected && isPicked && !isCorrect && <span style={{ color: "oklch(0.75 0.20 25)", fontWeight: 700, marginLeft: 8 }}>✗</span>}
                    </button>
                  );
                })}
              </div>
            </div>
            <div className="flash-hint"><span className="kbd">Space</span> 翻牌查看解析<div className="sep"></div><span className="kbd">←</span> <span className="kbd">→</span> 切換題目</div>
          </div>
          <div className="flash-face back" style={{ display: flipped ? "flex" : "none" }}>
            <div className="flash-meta">
              <div className="spec-icon-tile sm" style={{ marginRight: 4 }}><SpecIcon id={q.specialty} size={16}/></div>
              <span className="flash-tag spec">{spec.name}</span>
              <span className="flash-tag year">{q.year}</span>
              <span className="flash-tag" style={{ fontFamily: "var(--font-mono)" }}>{q.id}</span>
            </div>
            <div className="flash-answer-row">
              <div className="flash-answer-key">{q.answer}</div>
              <div><div className="flash-answer-label">正確答案</div><div className="flash-answer-text">{q.answerText}</div></div>
            </div>
            <div className="flash-explain">
              {q.explanation ? (
                <React.Fragment>
                  <h4><MedIcon name="lightbulb" size={11}/> 題解</h4><p>{q.explanation.summary}</p>
                  {q.explanation.points && <React.Fragment>
                    <h4><MedIcon name="bookmark" size={11}/> 重點整理</h4>
                    <ul>{q.explanation.points.map((p, i) => <li key={i}>{p}</li>)}</ul>
                  </React.Fragment>}
                  {q.explanation.keyword && <React.Fragment>
                    <h4><MedIcon name="search" size={11}/> 關鍵字</h4>
                    <p style={{ fontFamily: "var(--font-mono)", fontSize: 12.5, color: "var(--ink-2)" }}>{q.explanation.keyword}</p>
                  </React.Fragment>}
                </React.Fragment>
              ) : (
                <div style={{ padding: "20px 0", color: "var(--ink-3)", fontSize: 13, lineHeight: 1.7 }}>
                  <h4 style={{ color: "var(--accent)" }}><MedIcon name="lightbulb" size={11}/> 解答</h4>
                  <p>本題正確答案為 <strong style={{ color: "var(--accent)", fontFamily: "var(--font-mono)" }}>({q.answer})</strong>　{q.answerText}</p>
                  <p style={{ fontSize: 12, marginTop: 12, color: "var(--ink-3)" }}>※ 詳細題解尚未建置，可參考衛福部公告之原始試題與標準答案。</p>
                </div>
              )}
              <div className="flash-source"><div className="flash-source-label"><MedIcon name="book-open" size={10}/> 參考來源</div>{q.source}</div>
            </div>
          </div>
        </div>
      </div>
      {flipped ? (
        <div className="flash-actions">
          <button className="flash-btn again" onClick={() => rate("again")}><span className="lab">再練一次</span><span className="sub">完全不會 · <span className="kbd">1</span></span></button>
          <button className="flash-btn hard" onClick={() => rate("hard")}><span className="lab">有點難</span><span className="sub">勉強答對 · <span className="kbd">2</span></span></button>
          <button className="flash-btn good" onClick={() => rate("good")}><span className="lab">掌握了</span><span className="sub">熟練 · <span className="kbd">3</span></span></button>
        </div>
      ) : (
        <div className="flash-nav">
          <button className="icon-btn" onClick={prev} disabled={idx === 0}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
          <button className="flip-btn" onClick={() => setFlipped(true)}>{selected ? "查看完整題解" : "略過作答，直接看解答"}</button>
          <button className="icon-btn" onClick={next} disabled={idx === total - 1}><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
        </div>
      )}
    </div>
  );
}

// ===== Dashboard =====
function YearlyChart({ data }) {
  const W = 640, H = 280, PAD = { l: 40, r: 24, t: 28, b: 36 };
  const innerW = W - PAD.l - PAD.r, innerH = H - PAD.t - PAD.b;
  const maxApplied = Math.max(...data.map(d => d.applied));
  const yTicks = [0, 25, 50, 75, 100];
  const barW = (innerW / data.length) * 0.42, bandW = innerW / data.length;
  const linePath = data.map((d, i) => { const x = PAD.l + bandW * i + bandW / 2; const y = PAD.t + innerH - (d.rate / 100) * innerH; return (i === 0 ? "M" : "L") + x + " " + y; }).join(" ");
  return (
    <div className="panel">
      <div className="panel-head"><div><div className="panel-title">年度報考與通過率趨勢</div><div className="panel-sub">109–113 年 · 報考人數（長條）vs 通過率（折線）</div></div>
        <div className="legend"><span><span className="legend-dot" style={{ background: "color-mix(in oklch, var(--accent) 40%, transparent)", border: "1px solid var(--accent)" }}></span>報考人數</span><span><span className="legend-dot" style={{ background: "var(--accent)", boxShadow: "0 0 8px var(--accent-glow)" }}></span>通過率</span></div>
      </div>
      <svg viewBox={`0 0 ${W} ${H}`} className="chart-wrap" style={{ width: "100%", height: "auto" }}>
        <g className="chart-grid">{yTicks.map(t => { const y = PAD.t + innerH - (t / 100) * innerH; return <line key={t} x1={PAD.l} y1={y} x2={W - PAD.r} y2={y} strokeWidth="1"/>; })}</g>
        <g className="chart-axis">{yTicks.map(t => <text key={t} x={PAD.l - 8} y={PAD.t + innerH - (t / 100) * innerH + 4} textAnchor="end">{t}%</text>)}</g>
        {data.map((d, i) => { const x = PAD.l + bandW * i + bandW / 2 - barW / 2; const h = (d.applied / maxApplied) * innerH * 0.85; const y = PAD.t + innerH - h; return (
          <g key={d.year}><rect x={x} y={y} width={barW} height={h} fill="url(#barGrad)" stroke="var(--accent)" strokeWidth="1" rx="3" opacity="0.85"/><text x={PAD.l + bandW * i + bandW / 2} y={H - PAD.b + 18} textAnchor="middle" className="chart-axis" style={{ fontSize: 11, fill: "var(--ink-3)", fontFamily: "var(--font-mono)" }}>{d.year}</text><text x={PAD.l + bandW * i + bandW / 2} y={y - 6} textAnchor="middle" style={{ fontSize: 10, fill: "var(--ink-2)", fontVariantNumeric: "tabular-nums", fontFamily: "var(--font-mono)" }}>{d.applied.toLocaleString()}</text></g>
        ); })}
        <defs><linearGradient id="barGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stopColor="var(--accent)" stopOpacity="0.6"/><stop offset="100%" stopColor="var(--accent)" stopOpacity="0.15"/></linearGradient></defs>
        <path d={linePath} fill="none" stroke="var(--accent)" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ filter: "drop-shadow(0 0 6px var(--accent-glow))" }}/>
        {data.map((d, i) => { const x = PAD.l + bandW * i + bandW / 2; const y = PAD.t + innerH - (d.rate / 100) * innerH; return (
          <g key={d.year}><circle cx={x} cy={y} r="5" fill="var(--bg)" stroke="var(--accent)" strokeWidth="2.5" style={{ filter: "drop-shadow(0 0 6px var(--accent-glow))" }}/><text x={x} y={y - 12} textAnchor="middle" style={{ fontSize: 11, fontWeight: 700, fill: "var(--accent)", fontVariantNumeric: "tabular-nums", fontFamily: "var(--font-mono)" }}>{d.rate}%</text></g>
        ); })}
      </svg>
    </div>
  );
}
function SpecRingChart({ data, specs }) {
  const total = data.reduce((a, d) => a + d.passed, 0);
  const cx = 130, cy = 130, r = 88, sw = 26;
  let cum = 0;
  const palette = { internal: "var(--blue)", surgery: "var(--rose)", pediatric: "var(--warm)", obgyn: "var(--pink)", psych: "var(--violet)", anesth: "var(--green)" };
  const C = 2 * Math.PI * r;
  const segs = data.map(d => { const pct = d.passed / total; const len = C * pct; const offset = -cum; cum += len; const spec = specs.find(s => s.id === d.id); return { ...d, pct, len, offset, color: palette[d.id], name: spec.name }; });
  return (
    <div className="panel">

// ===== Review Today =====
function WeeklyHeatmap() {
  const weeks = 12, days = 7;
  const labels = ["一","二","三","四","五","六","日"];
  const data = [];
  for (let w = 0; w < weeks; w++) for (let d = 0; d < days; d++) { const seed = (w * 7 + d * 13) % 100; const v = seed > 75 ? 4 : seed > 55 ? 3 : seed > 35 ? 2 : seed > 18 ? 1 : 0; data.push({ w, d, v }); }
  const colors = ["var(--surface-alt)","oklch(0.32 0.08 195)","oklch(0.45 0.12 195)","oklch(0.60 0.15 195)","oklch(0.78 0.18 195)"];
  return (
    <div style={{ display: "flex", gap: 12, alignItems: "flex-start" }}>
      <div style={{ display: "flex", flexDirection: "column", gap: 4, paddingTop: 18, fontSize: 10, color: "var(--ink-3)" }}>{labels.map(l => <div key={l} style={{ height: 14 }}>{l}</div>)}</div>
      <div style={{ flex: 1 }}>
        <div style={{ display: "grid", gridTemplateColumns: `repeat(${weeks}, 1fr)`, gap: 4 }}>
          {Array.from({ length: weeks }).map((_, w) => <div key={w} style={{ display: "grid", gridTemplateRows: `repeat(${days}, 14px)`, gap: 4 }}>{Array.from({ length: days }).map((_, d) => { const cell = data.find(x => x.w === w && x.d === d); return <div key={d} style={{ background: colors[cell.v], borderRadius: 3 }} title={`Week ${w+1} · ${labels[d]} · ${cell.v} 題`}></div>; })}</div>)}
        </div>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginTop: 12, fontSize: 11, color: "var(--ink-3)" }}>
          <span>12 週前</span>
          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>少{colors.map((c, i) => <span key={i} style={{ width: 12, height: 12, background: c, borderRadius: 3 }}></span>)}多</div>
          <span>本週</span>
        </div>
      </div>
    </div>
  );
}

                  <tr key={u.uid} style={{ opacity: disabled ? 0.55 : 1 }}>
                    <td style={td}><div style={{ fontWeight: 600, color: "var(--ink-1)" }}>{u.name || "—"}{isMe && <span style={{ marginLeft: 6, fontSize: 10, color: "var(--accent-deep)" }}>（管理員）</span>}</div><div style={{ fontSize: 11.5, color: "var(--ink-3)", fontFamily: "var(--font-mono)" }}>{u.email}</div></td>
                    <td style={td}>{u.role === "certified" ? "已甄審 NP" : u.role === "other" ? "其他" : "訓練中 NP"}<div style={{ fontSize: 11.5, color: "var(--ink-3)" }}>{u.experience || "—"}</div></td>
                    <td style={td}>{specName(u.examGroup)}</td>
                    <td style={td}>{u.hospital || "—"}</td>
                    <td style={td}>{fmtDate(u.createdAt)}</td>
                    <td style={td}><span style={{ padding: "3px 9px", borderRadius: 20, fontSize: 11.5, fontWeight: 600, background: disabled ? "rgba(239,68,68,0.15)" : "rgba(34,197,94,0.15)", color: disabled ? "#ef4444" : "#22c55e" }}>{disabled ? "已停用" : "啟用中"}</span></td>
                    <td style={td}>
                      {isMe ? <span style={{ fontSize: 11.5, color: "var(--ink-3)" }}>—</span> : confirmDelete === u.uid ? (
                        <span style={{ display: "inline-flex", gap: 6 }}>
                          <button onClick={() => doDelete(u)} style={{ padding: "4px 10px", borderRadius: 6, border: "none", background: "#ef4444", color: "#fff", fontSize: 11.5, cursor: "pointer" }}>確認刪除</button>
                          <button onClick={() => setConfirmDelete(null)} style={{ padding: "4px 10px", borderRadius: 6, border: "1px solid var(--border)", background: "transparent", color: "var(--ink-2)", fontSize: 11.5, cursor: "pointer" }}>取消</button>
                        </span>
                      ) : (
                        <span style={{ display: "inline-flex", gap: 6 }}>
                          <button onClick={() => toggleStatus(u)} style={{ padding: "4px 10px", borderRadius: 6, border: "1px solid var(--border)", background: "transparent", color: "var(--ink-2)", fontSize: 11.5, cursor: "pointer" }}>{disabled ? "啟用" : "停用"}</button>
                          <button onClick={() => setConfirmDelete(u.uid)} style={{ padding: "4px 10px", borderRadius: 6, border: "1px solid rgba(239,68,68,0.4)", background: "transparent", color: "#ef4444", fontSize: 11.5, cursor: "pointer" }}>刪除</button>
                        </span>
                      )}
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ===== Main App =====
function Analytics({ onPickDeck }) {
  const [stats, setStats] = useState(null);
  const [loading, setLoading] = useState(true);
  useEffect(() => { let alive = true; window.StatsAPI.load().then(s => { if (alive) { setStats(s || {}); setLoading(false); } }).catch(() => { if (alive) { setStats({}); setLoading(false); } }); return () => { alive = false; }; }, []);
  const data = useMemo(() => {
    if (!stats) return null;
    const byId = {}; window.QUESTIONS.forEach(q => byId[q.id] = q);
    const entries = Object.entries(stats).map(([qid, s]) => ({ qid, q: byId[qid], n: (s && s.n) || 0, w: (s && s.w) || 0, last: s && s.last })).filter(e => e.q && e.n > 0);
    const totalN = entries.reduce((a, e) => a + e.n, 0);
    const totalW = entries.reduce((a, e) => a + e.w, 0);
    const attemptedQ = entries.length;
    const overallAcc = totalN ? Math.round((totalN - totalW) / totalN * 100) : 0;
    const agg = (keyFn, lookup) => {
      const m = {}; entries.forEach(e => { const k = keyFn(e.q); if (k == null) return; (m[k] = m[k] || { n: 0, w: 0, q: 0 }); m[k].n += e.n; m[k].w += e.w; m[k].q += 1; });
      return Object.entries(m).map(([id, v]) => ({ id, ...lookup(id), acc: Math.round((v.n - v.w) / v.n * 100), n: v.n, w: v.w, q: v.q })).sort((a, b) => a.acc - b.acc);
    };
    const bySpec = agg(q => q.specialty, id => { const s = window.SPECIALTIES.find(x => x.id === id); return { name: s ? s.name : id, className: s ? s.className : "" }; });
    const byType = agg(q => q.type, id => { const t = window.QUESTION_TYPES.find(x => x.id === id); return { name: t ? t.name : id }; });
    const mostWrong = entries.filter(e => e.w > 0).sort((a, b) => b.w - a.w || (b.w / b.n) - (a.w / a.n)).slice(0, 20);
    const kwMap = {};
    entries.filter(e => e.w > 0 && e.q.explanation && e.q.explanation.keyword).forEach(e => {
      String(e.q.explanation.keyword).split(/[、,，\/／]/).map(s => s.trim()).filter(Boolean).forEach(kw => { (kwMap[kw] = kwMap[kw] || { w: 0 }); kwMap[kw].w += e.w; });
    });
    const weakKw = Object.entries(kwMap).map(([kw, v]) => ({ kw, w: v.w })).sort((a, b) => b.w - a.w).slice(0, 14);
    const reviewQs = entries.filter(e => e.last === 0 || e.w > 0).map(e => e.q);
    return { totalN, totalW, attemptedQ, overallAcc, bySpec, byType, mostWrong, weakKw, reviewQs };
  }, [stats]);
  const accColor = (a) => a >= 80 ? "oklch(0.72 0.17 150)" : a >= 60 ? "oklch(0.78 0.15 90)" : "oklch(0.68 0.19 25)";
  const handleReset = async () => { if (!window.confirm("確定要清除你的作答統計嗎？此動作無法復原。")) return; try { await window.StatsAPI.reset(); } catch(e) {} setStats({}); };
  if (loading) return <div className="fade-in"><div className="page-head"><div><h1 className="page-title">弱點分析</h1><p className="page-sub">載入你的作答紀錄中…</p></div></div></div>;
  if (!data || data.attemptedQ === 0) return (
    <div className="fade-in"><div className="page-head"><div><h1 className="page-title">弱點分析</h1><p className="page-sub">個人化學習弱點分析</p></div></div>
      <div className="card" style={{ padding: 44, textAlign: "center" }}>
        <div style={{ fontSize: 42, marginBottom: 10 }}>📊</div>
        <div style={{ fontSize: 15, color: "var(--ink)", fontWeight: 600 }}>還沒有作答紀錄</div>
        <div style={{ fontSize: 13.5, marginTop: 8, color: "var(--ink-3)", lineHeight: 1.7 }}>到「考古題卡組」點選作答後，這裡就會分析你<b>最常答錯的題目</b>與<b>各科別的知識弱點</b>，並讓你一鍵針對弱點複習。</div>
      </div>
    </div>
  );
  const bar = (item) => (
    <div key={item.id} style={{ display: "grid", gridTemplateColumns: "88px 1fr 96px", alignItems: "center", gap: 12, padding: "8px 0" }}>
      <div style={{ fontSize: 13.5, fontWeight: 600, color: "var(--ink)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{item.name}</div>
      <div style={{ height: 10, borderRadius: 99, background: "var(--surface-alt)", overflow: "hidden" }}><div style={{ height: "100%", width: item.acc + "%", background: accColor(item.acc), borderRadius: 99, transition: "width .5s" }}></div></div>
      <div style={{ fontSize: 12.5, color: "var(--ink-3)", textAlign: "right", fontVariantNumeric: "tabular-nums" }}><b style={{ color: accColor(item.acc) }}>{item.acc}%</b> · 錯{item.w}/{item.n}</div>
    </div>
  );
  return (
    <div className="fade-in">
      <div className="page-head" style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-end", flexWrap: "wrap", gap: 12 }}>
        <div><h1 className="page-title">弱點分析</h1><p className="page-sub">依你的作答紀錄，找出常錯題目與知識弱點（登入後跨裝置同步）</p></div>
        <div style={{ display: "flex", gap: 10, alignItems: "center", flexWrap: "wrap" }}>
          {data.reviewQs.length > 0 && <button className="btn-primary" onClick={() => onPickDeck({ year: "弱點", specialty: "review", qs: data.reviewQs })}><MedIcon name="play" size={14}/><span style={{ marginLeft: 8 }}>針對弱點複習（{data.reviewQs.length} 題）</span></button>}
          <button type="button" onClick={handleReset} style={{ background: "none", border: "1px solid var(--border)", color: "var(--ink-3)", borderRadius: 8, padding: "9px 13px", fontSize: 12.5, cursor: "pointer", fontFamily: "inherit" }}>清除統計</button>
        </div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "repeat(3, 1fr)", gap: 12, marginBottom: 18 }}>
        <div className="card" style={{ padding: 18, textAlign: "center" }}><div style={{ fontSize: 12, color: "var(--ink-3)" }}>已作答題數</div><div style={{ fontSize: 30, fontWeight: 800 }}>{data.attemptedQ}</div></div>
        <div className="card" style={{ padding: 18, textAlign: "center" }}><div style={{ fontSize: 12, color: "var(--ink-3)" }}>整體答對率</div><div style={{ fontSize: 30, fontWeight: 800, color: accColor(data.overallAcc) }}>{data.overallAcc}%</div></div>
        <div className="card" style={{ padding: 18, textAlign: "center" }}><div style={{ fontSize: 12, color: "var(--ink-3)" }}>累計答錯次數</div><div style={{ fontSize: 30, fontWeight: 800, color: "oklch(0.7 0.18 25)" }}>{data.totalW}</div></div>
      </div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 16, marginBottom: 16 }}>
        <div className="card" style={{ padding: 22 }}>
          <h3 style={{ fontSize: 14, fontWeight: 700, margin: "0 0 6px" }}>各科別答對率<span style={{ fontSize: 12, color: "var(--ink-3)", fontWeight: 400, marginLeft: 8 }}>（由弱到強）</span></h3>
          {data.bySpec.map(bar)}
        </div>
        <div className="card" style={{ padding: 22 }}>
          <h3 style={{ fontSize: 14, fontWeight: 700, margin: "0 0 6px" }}>各題型答對率</h3>
          {data.byType.map(bar)}
          {data.weakKw.length > 0 && <React.Fragment>
            <h3 style={{ fontSize: 14, fontWeight: 700, margin: "18px 0 10px" }}>常錯知識主題</h3>
            <div style={{ display: "flex", flexWrap: "wrap", gap: 8 }}>
              {data.weakKw.map(k => <span key={k.kw} style={{ fontSize: 12.5, padding: "4px 11px", borderRadius: 20, background: "color-mix(in oklch, oklch(0.68 0.19 25) 14%, var(--surface-alt))", color: "oklch(0.72 0.16 25)", border: "1px solid color-mix(in oklch, oklch(0.68 0.19 25) 30%, transparent)" }}>{k.kw} <b>×{k.w}</b></span>)}
            </div>
          </React.Fragment>}
        </div>
      </div>
      <div className="card" style={{ padding: 22 }}>
        <h3 style={{ fontSize: 14, fontWeight: 700, margin: "0 0 12px" }}>最常答錯的題目<span style={{ fontSize: 12, color: "var(--ink-3)", fontWeight: 400, marginLeft: 8 }}>（點擊複習該題）</span></h3>
        <div style={{ display: "grid", gap: 8 }}>
          {data.mostWrong.map(e => { const sp = window.SPECIALTIES.find(s => s.id === e.q.specialty); return (
            <button key={e.qid} type="button" onClick={() => onPickDeck({ year: "複習", specialty: "review", qs: [e.q] })}
              style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 10, alignItems: "center", textAlign: "left", background: "var(--surface-alt)", border: "1px solid var(--border)", borderRadius: 10, padding: "10px 14px", cursor: "pointer", color: "inherit", font: "inherit", width: "100%" }}>
              <div style={{ minWidth: 0 }}>
                <div style={{ fontSize: 11.5, color: "var(--ink-3)", fontFamily: "var(--font-mono)", marginBottom: 2 }}>{e.qid} · {sp ? sp.name : ""}</div>
                <div style={{ fontSize: 13.5, color: "var(--ink)", whiteSpace: "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{e.q.stem.replace(/\n/g, " ").slice(0, 52)}…</div>
              </div>
              <div style={{ fontSize: 12.5, color: "oklch(0.72 0.16 25)", fontWeight: 700, whiteSpace: "nowrap" }}>答錯 {e.w}/{e.n} 次</div>
            </button>
          ); })}
        </div>
      </div>
    </div>
  );
}

function App() {
  const [page, setPage] = useState("home");
  const [activeDeck, setActiveDeck] = useState(null);
  const [user, setUser] = useState(() => (window.AuthAPI ? window.AuthAPI.current() : null));
  const [authReady, setAuthReady] = useState(() => (window.AuthAPI ? window.AuthAPI.current() !== null : false));
  const [menuOpen, setMenuOpen] = useState(false);
  const allDecks = useMemo(() => { const map = new Map(); for (const q of window.QUESTIONS) { const key = q.year + "::" + q.specialty; if (!map.has(key)) map.set(key, true); } return map.size; }, []);
  const handlePickDeck = (deck) => setActiveDeck(deck);
  const handleExitDeck = () => setActiveDeck(null);
  const handleLogout = async () => { setMenuOpen(false); setActiveDeck(null); setPage("home"); try { await window.AuthAPI.logout(); } catch(e) {} };
  useEffect(() => { if (!menuOpen) return; const onClick = (e) => { if (!e.target.closest(".user-menu")) setMenuOpen(false); }; document.addEventListener("click", onClick); return () => document.removeEventListener("click", onClick); }, [menuOpen]);
  useEffect(() => { const unsub = window.AuthAPI.subscribe((profile) => { setUser(profile); setAuthReady(true); }); const timer = setTimeout(() => setAuthReady(true), 1500); return () => { if (typeof unsub === "function") unsub(); clearTimeout(timer); }; }, []);
  if (!authReady) return <Loading />;
  if (!user) return <AuthScreen />;
  if (user.needsProfile && !user.isAdmin) return <ProfileCompletion user={user} />;
  let content;
  if (activeDeck) content = <Flashcard deck={activeDeck} onExit={handleExitDeck} />;
  else if (page === "home") content = <Home onNav={setPage} onPickDeck={handlePickDeck} />;
  else if (page === "decks") content = <DeckList onPickDeck={handlePickDeck} />;
  else if (page === "review") content = <ReviewToday onPickDeck={handlePickDeck} />;
  else if (page === "analytics") content = <Analytics onPickDeck={handlePickDeck} />;
  else if (page === "dashboard") content = <Dashboard />;
  else if (page === "syllabus") content = <Syllabus />;
  else if (page === "about") content = <About />;
  else if (page === "admin" && user.isAdmin) content = <AdminPanel />;
  const initials = (user.name || "U").trim().slice(0, 2).toUpperCase();
  const roleLabel = user.isAdmin ? "管理員" : user.isGuest ? "訪客" : user.role === "certified" ? "已甄審 NP" : user.role === "other" ? "其他" : "訓練中 NP";
  return (
    <div className="app">
      <Sidebar currentPage={page} onNav={(p) => { setActiveDeck(null); setPage(p); }} decks={allDecks} isAdmin={user.isAdmin} />
      <header className="topbar">
        <div className="topbar-left">
          <MedIcon name="pulse" size={16}/><span style={{ color: "var(--ink-3)" }}>NP Exam Prep Platform</span>
          <span style={{ width: 1, height: 14, background: "var(--border)" }}></span>
          <span style={{ color: "var(--ink-2)", fontWeight: 500 }}>{activeDeck ? "閃卡複習" : page === "home" ? "總覽" : page === "decks" ? "考古題卡組" : page === "review" ? "今日複習" : page === "analytics" ? "弱點分析" : page === "dashboard" ? "甄審通過率儀表板" : page === "syllabus" ? "命題大綱" : page === "admin" ? "使用者管理" : "關於本站"}</span>
        </div>
        <div className="topbar-right">
          <div className="topbar-time"><MedIcon name="calendar" size={13}/><span>{Math.max(...window.YEARS)} 年度</span></div>
          <div className="topbar-author">
            <div className="topbar-author-avatar"><MedIcon name="stethoscope" size={16}/></div>
            <div className="topbar-author-text">
              <div className="topbar-author-label">SITE AUTHOR</div>
              <div className="topbar-author-name">張家豪 醫師<span className="sep-dot"></span><span className="topbar-author-affil">新竹台大分院 急診醫學部</span></div>
              <div className="topbar-author-contact"><a href="mailto:g56017@hch.gov.tw" className="contact-chip" title="Email"><MedIcon name="mail" size={11}/><span>g56017@hch.gov.tw</span></a></div>
            </div>
          </div>
          <div className="user-menu">
            <button className="user-chip" onClick={(e) => { e.stopPropagation(); setMenuOpen(o => !o); }}>
              <div className="user-avatar">{initials}</div>
              <div className="user-chip-text"><div className="user-chip-name">{user.name}</div><div className="user-chip-role">{roleLabel}</div></div>
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" style={{ color: "var(--ink-3)" }}><path d="m6 9 6 6 6-6"/></svg>
            </button>
            {menuOpen && (
              <div className="user-pop">
                <div className="user-pop-head"><div className="user-pop-name">{user.name}</div><div className="user-pop-mail">{user.email}</div></div>
                <button className="user-pop-item" onClick={() => { setPage("about"); setMenuOpen(false); }}><MedIcon name="info" size={15}/>關於本站</button>
                <button className="user-pop-item danger" onClick={handleLogout}><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="m16 17 5-5-5-5"/><path d="M21 12H9"/></svg>登出</button>
              </div>
            )}
          </div>
        </div>
      </header>
      <main className="main">{content}</main>
    </div>
  );
}

// Load questions from external JSON before rendering
function Loading() {
  return (
    <div style={{position:"fixed",inset:0,display:"grid",placeItems:"center",background:"var(--bg)",color:"var(--ink-1)"}}>
      <div style={{textAlign:"center"}}>
        <div style={{width:48,height:48,border:"3px solid var(--surface-alt)",borderTopColor:"var(--accent)",borderRadius:"50%",margin:"0 auto 16px",animation:"spin 0.8s linear infinite"}}></div>
        <div style={{fontSize:14,color:"var(--ink-2)",letterSpacing:"0.06em"}}>載入題庫中…</div>
        <style>{`@keyframes spin { to { transform: rotate(360deg); } }`}</style>
      </div>
    </div>
  );
}

const rootEl = ReactDOM.createRoot(document.getElementById("root"));
rootEl.render(<Loading />);

fetch("questions.json")
  .then(r => r.json())
  .then(data => {
    window.QUESTIONS = data;
    rootEl.render(<App />);
  })
  .catch(err => {
    console.error("Failed to load questions.json", err);
    window.QUESTIONS = [];
    rootEl.render(<App />);
  });
  </script>
</body>
